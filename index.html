<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Dyżurów - Świąteczna Edycja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ŚWIĄTECZNY KLIMAT --- */
        
        /* Tło poza ekranem - Ciemna zieleń choinkowa */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f2b1d; 
            background-image: radial-gradient(#1a4231 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: auto;
        }

        /* Symulacja ekranu - Świąteczna Kartka */
        #device-screen {
            width: 640px;
            height: 500px;
            background-color: #fffaf0; /* Ciepły kremowy */
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.3); /* Czerwona poświata */
            flex-shrink: 0;
            border: 8px solid #b91c1c; /* Czerwona ramka */
            border-radius: 12px;
        }

        /* Dekoracja - Śnieg (CSS only) */
        .snowflake {
            position: absolute;
            top: -10px;
            color: #dbeafe;
            font-size: 1em;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px #000;
            user-select: none;
            z-index: 50;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 1; }
            100% { transform: translateY(520px) translateX(20px); opacity: 0.3; }
        }

        /* Obszar roboczy */
        #content-area {
            width: 100%;
            height: 470px; 
            overflow: hidden; 
            padding: 6px;
            display: flex;
            flex-direction: column;
            z-index: 10; /* Powyżej śniegu */
        }

        /* Margines bezpieczeństwa */
        #safe-margin {
            height: 30px;
            width: 100%;
            background: repeating-linear-gradient(
                45deg,
                #b91c1c,
                #b91c1c 10px,
                #fca5a5 10px,
                #fca5a5 20px
            ); /* Pasek na dole jak laska cukrowa */
            opacity: 0.8;
        }

        /* Kolory nagłówków - Bardziej nasycone, świąteczne */
        .header-green { background-color: #15803d; color: white; border-bottom: 2px solid #14532d; } /* Ciemna zieleń */
        .header-purple { background-color: #7e22ce; color: white; }
        .header-orange { background-color: #ea580c; color: white; }
        .header-yellow { background-color: #fbbf24; color: #78350f; font-weight: bold; } /* Złoty */
        .header-red { background-color: #dc2626; color: white; } /* Czerwień Mikołaja */
        .header-blue { background-color: #2563eb; color: white; }
        .header-gray { background-color: #4b5563; color: white; }
        
        /* Animacja pulsowania - Złota poświata */
        @keyframes pulse-gold {
            0%, 100% { background-color: #fef9c3; border-left-color: #ca8a04; box-shadow: inset 0 0 10px rgba(234, 179, 8, 0.2); }
            50% { background-color: #fde047; border-left-color: #a16207; box-shadow: inset 0 0 15px rgba(234, 179, 8, 0.5); }
        }

        .highlight-row { 
            animation: pulse-gold 3s infinite ease-in-out;
            font-weight: 700;
            border-left: 4px solid #ca8a04 !important; /* Złoty pasek */
        }
        .highlight-row td { color: #854d0e; }

        /* Styl czerwonej linii podczas lekcji - Girlanda */
        .lesson-separator td {
            border-bottom: 3px dashed #dc2626 !important; 
        }

        td.empty-cell { text-align: center; color: #d1d5db; font-size: 8px; }
        
        /* Tabela */
        .compact-table { table-layout: fixed; }
        .compact-table th, .compact-table td {
            padding: 1px 2px;
            font-size: 9px; 
            line-height: 1.2;
            text-align: center;
            white-space: normal;
            word-break: break-word;
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6; 
            overflow: hidden;
        }
        
        .compact-table tbody tr:nth-child(even) { background-color: #fff; }
        .compact-table tbody tr:nth-child(odd) { background-color: #fafaf9; }

        .compact-table thead th { 
            font-size: 8px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.3); 
            padding-top: 4px;
            padding-bottom: 4px;
            vertical-align: middle;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .nr-column { width: 18px; background-color: #374151; color: #e5e7eb; }
        .hour-column { width: 35px; font-size: 8px !important; background-color: #374151; color: #e5e7eb; }
        .obiad-column { width: 45px; }
        
        /* Tytuł dnia - Czcionka świąteczna */
        #current-day-title { 
            font-family: 'Mountains of Christmas', cursive; 
            font-size: 22px; 
            font-weight: 700;
            color: #b91c1c; /* Ciemna czerwień */
        }

        /* Pasek postępu - Candy Cane */
        .candy-stripe {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.3) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0.3) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
            animation: move-stripes 1s linear infinite;
        }
        @keyframes move-stripes {
            from { background-position: 0 0; }
            to { background-position: 20px 20px; }
        }

        #progress-bar {
            transition: width 1s linear, background-color 0.5s ease;
        }
    </style>
</head>

    // Generowanie śniegu
    function createSnowflakes() {
        const container = document.getElementById('snow-container');
        const count = 30;
        for(let i=0; i<count; i++) {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            flake.innerHTML = '❄';
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
            flake.style.opacity = Math.random();
            flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
            container.appendChild(flake);
        }
    }

    // Funkcja budująca HTML tabeli
    function generujTabele() {
        for (const [dzien, wiersze] of Object.entries(bazaDyzurow)) {
            const tbody = document.getElementById(`tbody-${dzien}`);
            if (!tbody) continue;
            
            tbody.innerHTML = ''; 
            
            wiersze.forEach(daneWiersza => {
                const tr = document.createElement('tr');
                
                daneWiersza.forEach((tresc, index) => {
                    const td = document.createElement('td');
                    
                    if (index === 0) td.className = "font-bold text-gray-500"; 
                    if (index === 1) td.className = "font-medium"; 
                    
                    if (tresc === "-" || tresc.trim() === "") {
                        td.className += " empty-cell";
                    }
                    
                    td.innerHTML = tresc;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }
    }

    // Funkcja aktualizująca pasek postępu i licznik
    function updateTimer(startTimeInMinutes, endTimeInMinutes, isLesson) {
        const timerContainer = document.getElementById('timer-container');
        const progressBar = document.getElementById('progress-bar');
        const countdownText = document.getElementById('timer-countdown');
        const timerLabel = document.getElementById('timer-label');

        timerContainer.classList.remove('hidden');

        if (isLesson) {
            timerLabel.innerText = "LEKCJA:";
            timerLabel.className = "text-[9px] font-bold uppercase tracking-wider text-red-600";
            progressBar.classList.remove('bg-green-500');
            progressBar.classList.add('bg-red-500');
        } else {
            // Poprawiono 'Do końca:' na 'PRZERWA:' i ujednolicono 'Do końca:' na 'PRZERWA:' dla lepszej spójności
            timerLabel.innerText = "PRZERWA:"; 
            timerLabel.className = "text-[9px] font-bold uppercase tracking-wider text-green-600";
            progressBar.classList.remove('bg-red-500');
            progressBar.classList.add('bg-green-500');
        }

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const currentSeconds = now.getSeconds();
        
        const startTotalSeconds = startTimeInMinutes * 60;
        const endTotalSeconds = endTimeInMinutes * 60;
        const currentTotalSeconds = currentMinutes * 60 + currentSeconds;
        
        const totalDurationSeconds = endTotalSeconds - startTotalSeconds;
        const elapsedSeconds = currentTotalSeconds - startTotalSeconds;
        const remainingSeconds = endTotalSeconds - currentTotalSeconds;

        if (remainingSeconds <= 0) {
            progressBar.style.width = '100%';
            countdownText.innerText = "00:00";
            return;
        }

        const percentage = Math.min(100, Math.max(0, (elapsedSeconds / totalDurationSeconds) * 100));
        progressBar.style.width = `${percentage}%`;
        
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        countdownText.innerText = `${m}:${s < 10 ? '0' + s : s}`;
    }

    document.addEventListener('DOMContentLoaded', function() {

        const schedules = document.querySelectorAll('.schedule-body');
        const currentDayTitle = document.getElementById('current-day-title');
        const dayIdMap = ['niedziela', 'poniedzialek', 'wtorek', 'sroda', 'czwartek', 'piatek', 'sobota'];
        
        // POPRAWIONA MAPA DNI Z POLSKIMI ZNAKAMI
        const dayNameMap = {
            'niedziela': 'Niedziela', 
            'poniedzialek': 'Poniedziałek', // POPRAWIONO 
            'wtorek': 'Wtorek',
            'sroda': 'Środa', // POPRAWIONO
            'czwartek': 'Czwartek',
            'piatek': 'Piątek', // POPRAWIONO
            'sobota': 'Sobota'
        };

        function updateState(dayId) {
            document.querySelectorAll('.schedule-body tr').forEach(row => {
                row.classList.remove('highlight-row');
                row.classList.remove('lesson-separator');
            });

            const activeTbody = document.getElementById(`tbody-${dayId}`);
            if (!activeTbody) {
                document.getElementById('timer-container').classList.add('hidden');
                return;
            }

            const rows = activeTbody.querySelectorAll('tr');
            const now = new Date();
            const currentTimeInMinutes = now.getHours() * 60 + now.getMinutes();
            
            let activeFound = false;
            let nextBreakRow = null;
            let previousBreakEnd = null;
            let previousRow = null;

            for (const row of rows) {
                const timeCell = row.cells[1]; 
                if (!timeCell) continue;
                
                const timeText = timeCell.innerHTML.replace('<br>', ' ');
                const times = timeText.trim().split(/\s+/);
                if (times.length < 2) continue;

                const timeMatchStart = times[0].match(/(\d{1,2}):(\d{2})/);
                const timeMatchEnd = times[1].match(/(\d{1,2}):(\d{2})/);

                if (timeMatchStart && timeMatchEnd) {
                    const startHour = parseInt(timeMatchStart[1], 10);
                    const startMinute = parseInt(timeMatchStart[2], 10);
                    const endHour = parseInt(timeMatchEnd[1], 10);
                    const endMinute = parseInt(timeMatchEnd[2], 10);

                    const startTimeInMinutes = startHour * 60 + startMinute;
                    const endTimeInMinutes = endHour * 60 + endMinute;
                    
                    if (currentTimeInMinutes >= startTimeInMinutes && currentTimeInMinutes < endTimeInMinutes) {
                        row.classList.add('highlight-row');
                        updateTimer(startTimeInMinutes, endTimeInMinutes, false);
                        activeFound = true;
                        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        return;
                    }

                    if (previousBreakEnd !== null) {
                        if (currentTimeInMinutes >= previousBreakEnd && currentTimeInMinutes < startTimeInMinutes) {
                            if (previousRow) previousRow.classList.add('lesson-separator');
                            updateTimer(previousBreakEnd, startTimeInMinutes, true);
                            activeFound = true;
                            if(previousRow) previousRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            return;
                        }
                    }
                    
                    if (nextBreakRow === null && currentTimeInMinutes < startTimeInMinutes) {
                        nextBreakRow = row;
                    }

                    previousBreakEnd = endTimeInMinutes;
                    previousRow = row;
                }
            }

            if (!activeFound) {
                document.getElementById('timer-container').classList.add('hidden');
                if (nextBreakRow) nextBreakRow.classList.add('highlight-row'); 
            }
        }

        function showScheduleForDay(dayId) {
            schedules.forEach(tbody => tbody.classList.add('hidden'));
            const activeTbody = document.getElementById(`tbody-${dayId}`);
            
            if (activeTbody) {
                activeTbody.classList.remove('hidden');
            }
            
            if (currentDayTitle && dayNameMap[dayId]) {
                // Użycie poprawnie przetłumaczonego DYŻURY: i nazwy dnia
                currentDayTitle.textContent = `DYŻURY: ${dayNameMap[dayId].toUpperCase()}`;
            }
            
            updateState(dayId);
        }

        const todayIndex = new Date().getDay();
        const defaultDayId = (todayIndex === 0 || todayIndex === 6) ? 'poniedzialek' : dayIdMap[todayIndex];
        
        showScheduleForDay(defaultDayId);

        setInterval(() => {
            const now = new Date();
            const currentDayIndex = now.getDay();
            const currentDayId = (currentDayIndex === 0 || currentDayIndex === 6) ? 'poniedzialek' : dayIdMap[currentDayIndex];
            
            const activeTbody = document.querySelector('.schedule-body:not(.hidden)');
            const activeId = activeTbody ? activeTbody.id.replace('tbody-', '') : null;
            
            if (currentDayId !== activeId) {
                showScheduleForDay(currentDayId);
            } else {
                updateState(currentDayId);
            }
        }, 1000);
    });
</script>
