<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Dyżurów - Świąteczna Edycja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> 
    <style>
        :root {
            --christmas-red: #dc2626;
            --christmas-green: #14532d;
            --cream: #fffaf0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f2b1d; 
            background-image: radial-gradient(#1a4231 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #device-screen {
            width: 100%;
            max-width: 800px;
            background-color: var(--cream);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.3);
            border: 6px solid #b91c1c;
            border-radius: 16px;
        }

        /* Nagłówki kolorystyczne */
        .header-green { background-color: #15803d; color: white; }
        .header-purple { background-color: #7e22ce; color: white; }
        .header-orange { background-color: #ea580c; color: white; }
        .header-yellow { background-color: #fbbf24; color: #78350f; font-weight: bold; }
        .header-red { background-color: #dc2626; color: white; }
        .header-blue { background-color: #2563eb; color: white; }
        .header-gray { background-color: #4b5563; color: white; }

        /* Tabela */
        .compact-table { width: 100%; table-layout: fixed; border-collapse: collapse; }
        .compact-table th, .compact-table td {
            padding: 4px 2px;
            font-size: 10px; 
            line-height: 1.2;
            text-align: center;
            word-break: break-word;
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6; 
        }

        /* Wiersz wyróżniony (obecna przerwa) */
        @keyframes pulse-gold {
            0%, 100% { background-color: #fef9c3; border-left: 4px solid #ca8a04; }
            50% { background-color: #fde047; border-left: 4px solid #a16207; }
        }
        .highlight-row { 
            animation: pulse-gold 2s infinite ease-in-out;
            font-weight: 700;
        }

        /* Marker lekcji */
        .lesson-separator td {
            border-bottom: 3px dashed #dc2626 !important; 
        }

        /* Pasek postępu - Candy Cane */
        .candy-stripe {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.3) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0.3) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
            animation: move-stripes 1s linear infinite;
        }
        @keyframes move-stripes {
            from { background-position: 0 0; }
            to { background-position: 20px 20px; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #b91c1c; border-radius: 10px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="device-screen">
        <!-- Header -->
        <header class="bg-white p-3 border-b-4 border-red-600 shadow-sm flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🎄</span>
                <h1 id="current-day-title" class="text-xl font-black text-red-700 uppercase tracking-tighter">Plan Dyżurów</h1>
            </div>

            <div id="timer-ui" class="flex items-center gap-3 bg-red-50 p-2 rounded-lg border border-red-200 hidden">
                <div class="text-right leading-none">
                    <p id="timer-label" class="text-[10px] font-bold text-red-600 uppercase">Pozostało:</p>
                    <p id="timer-countdown" class="text-xl font-mono font-black text-gray-800">00:00</p>
                </div>
                <div class="w-24 bg-gray-200 rounded-full h-4 overflow-hidden border border-red-200">
                    <div id="progress-bar" class="h-full candy-stripe bg-red-500" style="width: 0%"></div>
                </div>
            </div>

            <button onclick="openModal()" class="bg-green-700 hover:bg-green-800 text-white p-2 rounded-full transition-transform active:scale-95 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-grow overflow-auto bg-white/50 backdrop-blur-sm p-1">
            <table class="compact-table">
                <thead class="sticky top-0 z-20 shadow-sm">
                    <tr class="text-white uppercase text-[9px]">
                        <th class="bg-gray-800 w-[25px]">Nr</th>
                        <th class="bg-gray-800 w-[45px]">Czas</th>
                        <th class="header-green">Ziel</th>
                        <th class="header-purple">Fiol</th>
                        <th class="header-orange">Pom</th>
                        <th class="bg-gray-500">Undr</th>
                        <th class="header-yellow">Żółt</th>
                        <th class="header-red">Czerw</th>
                        <th class="header-blue">Nieb</th>
                        <th class="bg-gray-500">Part</th>
                        <th class="bg-gray-500">SG</th>
                        <th class="header-gray w-[50px]">Obiad</th>
                    </tr>
                </thead>
                <tbody id="main-table-body">
                    <!-- Dynamicznie generowane wiersze -->
                </tbody>
            </table>
        </main>

        <!-- Footer Decor -->
        <footer class="h-6 w-full opacity-80" style="background: repeating-linear-gradient(45deg, #b91c1c, #b91c1c 10px, #fca5a5 10px, #fca5a5 20px);"></footer>
    </div>

    <!-- MODAL EDYTOR -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border-4 border-red-600">
            <div class="p-4 border-b flex justify-between items-center bg-red-50">
                <h2 class="text-xl font-bold text-red-700 flex items-center gap-2">
                    <span>🎅</span> Edytor Świątecznego Planu
                </h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-600 text-3xl">&times;</button>
            </div>

            <div class="p-4 flex gap-4 bg-white">
                <select id="day-selector" onchange="renderEditor()" class="flex-grow p-2 border-2 border-green-200 rounded-lg focus:border-green-500 outline-none font-bold text-green-800">
                    <option value="poniedzialek">Poniedziałek</option>
                    <option value="wtorek">Wtorek</option>
                    <option value="sroda">Środa</option>
                    <option value="czwartek">Czwartek</option>
                    <option value="piatek">Piątek</option>
                </select>
                <button onclick="resetData()" class="px-4 py-2 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg">Resetuj</button>
            </div>

            <div class="flex-grow overflow-auto p-2">
                <table class="w-full text-[10px] border-collapse" id="editor-table">
                    <!-- Pola edycji -->
                </table>
            </div>

            <div class="p-4 border-t bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-3">
                <button onclick="copyRawData()" class="text-blue-600 text-[10px] underline">Kopiuj kod JSON</button>
                <button onclick="saveData()" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-black px-10 py-3 rounded-xl shadow-lg transform transition active:scale-95">
                    ZAPISZ I ZAMKNIJ
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_DATA = {

                ["4", "11:40-11:50", "W. Wrzaszcz", "J. Miecznik", "K. Miąsik/ks. A. Hepek", "O. Ginalska", "E. Krzyżyk", "K. Bugajska", "R. Rogalski", "I. Wilczyńska", "T. Zygmunt", "-"],

            ],

                ["0", "8:00-8:10", "W. Wrzaszcz", "J. Miecznik", "K. Miąsik", "-", "O. Ginalska", "K. Jochymek", "A. Lorenc", "-", "T. Zygmunt", "-"],
                ["1", "8:55-9:05", "E. Szostak", "M. Szydłowska", "A. Szydł/I. Wilcz", "A. Misiołek", "M. Gil", "J. Wojtan", "K. Jakubowska", "-", "K. Matysek-Sob", "-"],
                ["2", "9:50-10:00", "W. Wrzaszcz", "K. Miąsik", "E. Łubińska/A. Lorenc", "M. Szeligiewicz", "T. Majewski", "K. Bugajska", "A. Mizerska", "-", "T. Zygmunt", "-"],
                ["3", "10:45-10:55", "E. Szostak", "J. Miecznik", "A. Szydł/E. Łubińska", "A. Misiołek", "A. Stankiewicz", "K. Jochymek", "K. Jakubowska", "-", "K. Matysek-Sob", "-"],
                ["4", "11:40-11:50", "K. Matysek-Sob", "R. Ciszewska", "M. Niedb/D. Kolany", "O. Ginalska", "E. Krzyżyk", "J. Wojtan", "M. Rzepka", "P. Latosińska", "D. Piątek", "-"],
                ["5", "12:35-12:45", "-", "-", "A. Pierzch/R. Rogalski", "M. Szeligiewicz", "J. Szymkowicz", "K. Bugajska", "K. Jakubowska", "M. Ankiewicz", "D. Piątek", "-"]
            ],
            sroda: [
                ["0", "8:00-8:10", "K. Matysek-Sob", "M. Niedbał", "E. Łubińska", "-", "J. Dominikowska", "J. Wojtan", "K. Jakubowska", "-", "K. Czajęcka", "-"],
                ["1", "8:55-9:05", "E. Szostak", "J. Miecznik", "E. Łub/A. Pierzch", "A. Misiołek", "O. Ginalska", "I. Wilczyńska", "M. Rzepka", "-", "K. Czajęcka", "-"],
                ["2", "9:50-10:00", "K. Matysek-Sob", "R. Ciszewska", "M. Niedbał/M. Gil", "J. Dominikowska", "T. Majewski", "K. Bugajska", "K. Jakubowska", "-", "T. Zygmunt", "-"],
                ["3", "10:45-10:55", "W. Wrzaszcz", "R. Rogalski", "D. Gałka/M. Ankiewicz", "M. Szeligiewicz", "A. Stankiewicz", "J. Wojtan", "A. Mizerska", "-", "D. Piątek", "-"],
                ["4", "11:40-11:50", "J. Hartel", "M. Szydłowska", "A. Szydłowska/M. Piekarski", "A. Misiołek", "J. Szymkowicz", "M. Gil", "M. Rzepka", "A. Lorenc", "K. Matysek-Sob", "-"],
                ["5", "12:35-12:45", "-", "-", "A. Pierzch/E. Łubińska", "M. Szeligiewicz", "D. Gałka", "K. Bugajska", "A. Mizerska", "A. Stankiewicz", "T. Zygmunt", "-"]
            ],
            czwartek: [
                ["0", "8:00-8:10", "K. Matysek-Sob", "R. Ciszewska", "A. Stankiewicz", "-", "T. Majewski", "I. Wilczyńska", "M. Rzepka", "-", "T. Zygmunt", "-"],
                ["1", "8:55-9:05", "K. Matysek-Sob", "R. Ciszewska", "A. Pierzch/D. Gałka", "O. Ginalska", "P. Latosińska", "I. Wilczyńska", "A. Solińska", "-", "D. Piątek", "-"],
                ["2", "9:50-10:00", "E. Szostak", "M. Szydłowska", "A. Szydłowska/M. Gil", "A. Stankiewicz", "K. Jakubowska", "K. Jochymek", "A. Mizerska", "-", "T. Zygmunt", "-"],
                ["3", "10:45-10:55", "W. Wrzaszcz", "R. Ciszewska", "D. Gałka/D. Kolany", "M. Ankiewicz", "J. Szymkowicz", "K. Bugajska", "M. Rzepka", "-", "K. Czajęcka", "-"],
                ["4", "11:40-11:50", "W. Wrzaszcz", "R. Rogalski", "E. Łubińska/M. Niedbał", "O. Ginalska", "J. Wojtan", "K. Jochymek", "K. Jakubowska", "J. Hartel", "-", "-"],
                ["5", "12:35-12:50", "R. Rogalski", "J. Miecznik", "A. Pierzch/M. Gil", "M. Ankiewicz", "T. Majewski", "J. Wojtan", "A. Mizerska", "K. Bugajska", "-", "E. Łubińska"],
                ["6", "13:35-13:50", "-", "-", "D. Gałka", "", "E. Krzyżyk", "-", "-", "M. Rzepka", "-", "A. Stankiewicz"]
            ],
            piatek: [
                ["0", "8:00-8:10", "M. Ankiewicz", "R. Rogalski", "A. Szydłowska", "-", "M. Gil", "K. Bugajska", "A. Mizerska", "-", "D. Piątek", "-"],
                ["1", "8:55-9:05", "E. Szostak", "M. Szydłowska", "A. Pierzch/P. Latos", "M. Ankiewicz", "T. Majewski", "J. Wojtan", "K. Jakubowska", "-", "T. Zygmunt", "-"],
                ["2", "9:50-10:00", "ks. Hepek", "M. Niedbał", "A. Szydłowska/D. Gałka", "A. Stankiewicz", "J. Szymkowicz", "K. Jochymek", "M. Rzepka", "-", "K. Czajęcka", "-"],
                ["3", "10:45-10:55", "E. Szostak", "J. Miecznik", "K. Miąsik/M. Piekarski", "A. Solińska", "T. Majewski", "K. Jakubowska", "A. Mizerska", "-", "K. Matysek-Sob", "-"],
                ["4", "11:40-11:50", "M. Niedbał", "J. Hartel", "A. Pierzch/M. Gil", "O. Ginalska", "E. Krzyżyk", "K. Bugajska", "M. Rzepka", "P. Latosińska", "T. Zygmunt", "-"],
                ["5", "12:35-12:50", "W. Wrzaszcz", "R. Rogalski", "D. Gałka/M. Piekarski", "A. Stankiewicz", "K. Jochymek", "J. Wojtan", "A. Mizerska", "J. Hartel", "D. Piątek", "R. Ciszewska"],
                ["6", "13:35-13:50", "M. Niedbał", "K. Miąsik", "E. Łubińska", "O. Ginalska", "M. Gil", "M. Rzepka", "-", "P. Latosińska", "D. Piątek", "A. Szydłowska"],
                ["7", "14:35-14:40", "-", "-", "-", "-", "-", "-", "-", "-", "T. Zygmunt", "-"]
            ]
        };

        let currentData = JSON.parse(localStorage.getItem('duty_schedule_radek')) || JSON.parse(JSON.stringify(DEFAULT_DATA));
        const dayMap = { 1: 'poniedzialek', 2: 'wtorek', 3: 'sroda', 4: 'czwartek', 5: 'piatek', 6: 'poniedzialek', 0: 'poniedzialek' };
        const dayNames = { poniedzialek: 'Poniedziałek', wtorek: 'Wtorek', sroda: 'Środa', czwartek: 'Czwartek', piatek: 'Piątek' };

        function getMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function refreshMainTable() {
            const now = new Date();
            const dayIdx = now.getDay();
            const dayKey = dayMap[dayIdx];
            const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();
            const seconds = now.getSeconds();

            const tbody = document.getElementById('main-table-body');
            const title = document.getElementById('current-day-title');
            const timerUi = document.getElementById('timer-ui');

            title.innerText = `DYŻURY: ${dayNames[dayKey].toUpperCase()}`;
            tbody.innerHTML = '';

            let data = currentData[dayKey] || [];
            let activeBreakIdx = -1;
            let activeLessonIdx = -1;

            // Logika wykrywania czasu
            data.forEach((row, idx) => {
                const times = row[1].split('-');
                if(times.length < 2) return;
                const start = getMinutes(times[0]);
                const end = getMinutes(times[1]);

                if (currentTotalMinutes >= start && currentTotalMinutes < end) {
                    activeBreakIdx = idx;
                }

                if (idx > 0) {
                    const prevEnd = getMinutes(data[idx-1][1].split('-')[1]);
                    if (currentTotalMinutes >= prevEnd && currentTotalMinutes < start) {
                        activeLessonIdx = idx - 1;
                    }
                }
            });

            // Renderowanie tabeli
            data.forEach((rowData, idx) => {
                const tr = document.createElement('tr');
                if (idx === activeBreakIdx) tr.className = 'highlight-row';
                if (idx === activeLessonIdx) tr.className = 'lesson-separator';

                rowData.forEach((cell, cIdx) => {
                    const td = document.createElement('td');
                    td.innerText = (cell === '-' || !cell) ? '' : cell;
                    if (cIdx === 1) td.style.fontSize = '9px';
                    if (cIdx === 0 || cIdx === 1) td.className += ' font-bold bg-gray-50';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            // Update Timera
            if (activeBreakIdx !== -1) {
                timerUi.classList.remove('hidden');
                const [sStr, eStr] = data[activeBreakIdx][1].split('-');
                updateTimerUI(getMinutes(sStr), getMinutes(eStr), currentTotalMinutes, seconds, false);
            } else if (activeLessonIdx !== -1 && data[activeLessonIdx+1]) {
                timerUi.classList.remove('hidden');
                const prevEnd = getMinutes(data[activeLessonIdx][1].split('-')[1]);
                const nextStart = getMinutes(data[activeLessonIdx+1][1].split('-')[0]);
                updateTimerUI(prevEnd, nextStart, currentTotalMinutes, seconds, true);
            } else {
                timerUi.classList.add('hidden');
            }
        }

        function updateTimerUI(start, end, nowM, nowS, isLesson) {
            const progressBar = document.getElementById('progress-bar');
            const countdown = document.getElementById('timer-countdown');
            const label = document.getElementById('timer-label');

            const totalSec = (end - start) * 60;
            const elapsedSec = (nowM - start) * 60 + nowS;
            const remainSec = totalSec - elapsedSec;

            const progress = (elapsedSec / totalSec) * 100;
            progressBar.style.width = `${Math.min(100, progress)}%`;
            
            label.innerText = isLesson ? "DO KOŃCA LEKCJI:" : "DO KOŃCA PRZERWY:";
            label.className = isLesson ? "text-[10px] font-bold text-red-600 uppercase" : "text-[10px] font-bold text-green-600 uppercase";
            progressBar.className = `h-full candy-stripe ${isLesson ? 'bg-red-500' : 'bg-green-500'}`;

            const m = Math.floor(Math.max(0, remainSec) / 60);
            const s = Math.max(0, remainSec % 60);
            countdown.innerText = `${m}:${s < 10 ? '0' + s : s}`;
        }

        // --- OBSŁUGA MODALA I EDYCJI ---
        function openModal() {
            document.getElementById('edit-modal').classList.remove('hidden');
            renderEditor();
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function renderEditor() {
            const day = document.getElementById('day-selector').value;
            const table = document.getElementById('editor-table');
            table.innerHTML = '';

            if (!currentData[day]) return;

            currentData[day].forEach((row, rIdx) => {
                const tr = document.createElement('tr');
                tr.className = "border-b";
                row.forEach((cell, cIdx) => {
                    const td = document.createElement('td');
                    if (cIdx < 2) {
                        td.innerText = cell;
                        td.className = "p-1 bg-gray-100 font-bold text-center border-r";
                    } else {
                        const input = document.createElement('input');
                        input.value = cell;
                        input.className = "w-full p-1 border rounded focus:bg-yellow-50 outline-none text-center";
                        input.onchange = (e) => currentData[day][rIdx][cIdx] = e.target.value;
                        td.appendChild(input);
                    }
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
        }

        function saveData() {
            localStorage.setItem('duty_schedule_radek', JSON.stringify(currentData));
            refreshMainTable();
            closeModal();
        }

        function resetData() {
            if (confirm("Czy na pewno chcesz przywrócić domyślne ustawienia? Wszystkie zmiany zostaną usunięte.")) {
                currentData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveData();
                renderEditor();
            }
        }

        function copyRawData() {
            const code = `const bazaDyzurow = ${JSON.stringify(currentData, null, 2)};`;
            navigator.clipboard.writeText(code);
            alert("Kod został skopiowany do schowka!");
        }

        // Start
        setInterval(refreshMainTable, 1000);
        refreshMainTable();
    </script>
</body>
</html>
